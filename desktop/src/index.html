<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InferenceHub</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        background: #0d0d0d;
        color: rgba(255, 255, 255, 0.9);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      /* macOS traffic-light drag region */
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        -webkit-app-region: drag;
        z-index: 10000;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 20px;
      }

      .logo {
        width: 56px;
        height: 56px;
        opacity: 0.9;
      }

      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.9);
      }

      .subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.01em;
      }

      /* Simple animated ellipsis */
      .subtitle::after {
        content: "";
        animation: ellipsis 1.5s steps(4, end) infinite;
      }

      @keyframes ellipsis {
        0%   { content: ""; }
        25%  { content: "."; }
        50%  { content: ".."; }
        75%  { content: "..."; }
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>

    <div class="splash">
      <!-- InferenceHub "X" mark: white blades + lime spark -->
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
        <g fill="rgba(255,255,255,0.9)">
          <path d="M8 11 L24 11 L33.5 26.5 L27 29.5 Z"/>
          <path d="M8 53 L24 53 L33.5 37.5 L27 34.5 Z"/>
          <path d="M56 11 L40 11 L30.5 26.5 L37 29.5 Z"/>
          <path d="M56 53 L40 53 L30.5 37.5 L37 34.5 Z"/>
        </g>
        <path d="M27 30.2 L36 32 L36 34 L27 32.2 Z" fill="#a6e22e"/>
      </svg>

      <span class="title">InferenceHub</span>
      <span class="subtitle">Starting</span>
    </div>
  </body>
</html>
